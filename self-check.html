$('quiz').onsubmit=e=>{e.preventDefault();if(answered)return;const input=document.querySelector('input[name=answer]:checked');if(!input)return;answered=true;const q=groups[$('topic').value].questions[position],correct=Number(input.value)===q.answer;if(correct)score++;$('feedback').textContent=(correct?'Дұрыс! ':'Қате. Дұрыс жауап: ')+q.explanation;document.querySelectorAll('input[name=answer]').forEach(i=>i.disabled=true);$('check').hidden=true;$('next').hidden=false;$('next').textContent=position===4?'Қайта орындау':'Келесі сұрақ';$('progress').textContent=`Сұрақ ${position+1} / 5 · Дұрыс жауаптар: ${score}`;if(position===4)$('feedback').textContent+=` Нәтиже: ${score} / 5.`};$('next').onclick=()=>{if(position===4){position=0;score=0}else position++;show()};$('topic').onchange=()=>{position=0;score=0;show()};show();
</script></html>
